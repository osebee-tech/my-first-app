<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>자산노트</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>자산노트</h1>
        <p>간편한 자산 흐름 기록</p>
      </div>
      <button id="newBtn" class="primary">＋ 잔액 입력</button>
    </header>

    <!-- 대시보드 요약: 핵심인 누적 저축액 중심 배치 -->
    <section class="summary">
      <div class="card highlight">
        <span>올해 누적 저축</span>
        <b id="yearSaving">0원</b>
      </div>
      <div class="card">
        <span>현재 총 자산</span>
        <b id="currentMoney">0원</b>
      </div>
      <div class="card">
        <span>올해 총 지출</span>
        <b id="yearSpend">0원</b>
      </div>
    </section>

    <section class="sectionHead">
      <h2>월별 흐름</h2>
      <button id="manageBtn" class="textBtn">자산 관리</button>
    </section>

    <section id="months" class="months"></section>
  </main>

  <!-- 잔액 입력 모달 -->
  <div id="modal" class="modal hidden">
    <div class="sheet">
      <div class="sheetHead">
        <h2>자산 잔액 입력</h2>
        <button id="closeBtn" class="iconBtn">✕</button>
      </div>

      <div class="field">
        <label for="date">기록 날짜</label>
        <input id="date" type="date">
      </div>

      <div class="field">
        <label for="income">이번 달 수입 <small>(입력 시 지출이 자동 계산됨)</small></label>
        <input id="income" inputmode="numeric" placeholder="0">
      </div>

      <div class="field">
        <label for="memo">메모</label>
        <input id="memo" placeholder="선택사항 (예: 월급날 잔액)">
      </div>

      <div class="assetHead">
        <h3>통장별 잔액</h3>
        <span>빈칸 = 이전 값 유지</span>
      </div>

      <div id="assetInputs" class="assetInputs"></div>

      <button id="addAssetInRecord" class="secondary w100">＋ 새 통장/자산 추가</button>

      <div class="actions">
        <button id="cancelBtn" class="btn">취소</button>
        <button id="saveBtn" class="primary btn">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 자산 관리 모달 -->
  <div id="assetModal" class="modal hidden">
    <div class="sheet">
      <div class="sheetHead">
        <h2>통장/자산 목록 관리</h2>
        <button id="assetClose" class="iconBtn">✕</button>
      </div>
      <div id="assetList" class="assetList"></div>
      <button id="addAsset" class="secondary w100">＋ 자산 추가</button>
      <div class="actions">
        <button id="assetDone" class="primary btn">완료</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
