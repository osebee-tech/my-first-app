<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><title>초심플 자산노트</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans max-w-md mx-auto min-h-screen p-4 pb-10">
<header class="mb-6"><h1 class="text-xl font-black text-gray-900">🌱 자산노트</h1></header>
<main class="space-y-4">
  <section class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
    <div class="text-sm font-bold text-gray-400">이번 급여에 남은 돈</div>
    <div id="cycleBalance" class="text-4xl font-black text-gray-900 mt-2">—</div>
    <div id="cycleSub" class="text-sm text-gray-500 mt-2">아직 기록이 없어요.</div>
  </section>
  <section class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
    <div class="text-sm font-bold text-gray-400">내가 모아놓은 돈</div>
    <div id="totalAsset" class="text-3xl font-black text-gray-900 mt-2">—</div>
    <div id="periodSummary" class="text-sm text-gray-500 mt-2"></div>
  </section>
  <section id="actionArea" class="relative pt-7">
    <div id="guideBubble" class="hidden absolute left-3 right-3 top-0 -translate-y-1/2 bg-gray-900 text-white text-sm rounded-2xl px-4 py-3 pr-10 shadow-lg">
      <span id="guideText"></span><button id="guideClose" onclick="dismissGuide(event)" aria-label="안내 닫기" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-white/70 hover:text-white text-xl leading-none">×</button>
      <span class="absolute left-10 -bottom-2 w-4 h-4 bg-gray-900 rotate-45"></span>
    </div>
    <button id="recordButton" onclick="openRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-sm transition">＋ 지금 자산 기록하기</button>
  </section>
  <button onclick="toggleDetails()" class="w-full py-3 text-sm font-bold text-gray-500">상세 보기 <span id="detailArrow">⌄</span></button>
  <section id="details" class="hidden space-y-4">
    <div class="bg-white rounded-2xl p-5 border border-gray-100">
      <h2 class="font-bold mb-3">내 돈이 들어있는 곳</h2>
      <div id="assetList" class="space-y-2"></div>
    </div>
    <div class="bg-white rounded-2xl p-5 border border-gray-100">
      <h2 class="font-bold mb-3">지난 기록</h2><div id="history" class="space-y-2"></div>
    </div>
    <div class="bg-white rounded-2xl p-5 border border-gray-100">
      <h2 class="font-bold mb-3">데이터</h2>
      <div class="grid grid-cols-2 gap-2"><button onclick="exportData()" class="border rounded-xl py-3 text-sm font-bold">📤 내보내기</button><button onclick="importData()" class="border rounded-xl py-3 text-sm font-bold">📥 가져오기</button></div>
      <button onclick="resetData()" class="w-full mt-2 py-2 text-xs text-gray-400">데이터 초기화</button><input id="fileInput" type="file" accept="application/json" class="hidden" onchange="handleImport(event)">
    </div>
  </section>
</main>
<div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50">
  <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-5"><h2 class="text-lg font-black">지금 자산 기록하기</h2><button onclick="closeRecord()" class="text-2xl text-gray-400">×</button></div>
    <label class="text-xs font-bold text-gray-500">기록 날짜</label><input id="date" type="date" class="w-full border rounded-xl p-3 mt-1 mb-4">
    <label class="text-xs font-bold text-gray-500">이번 급여 금액 <span class="font-normal">(알고 있다면)</span></label><input id="salary" type="number" placeholder="예: 3000000" class="w-full border rounded-xl p-3 mt-1 mb-4">
    <div class="flex justify-between items-center mb-2"><label class="text-xs font-bold text-gray-500">돈이 들어있는 곳</label><button onclick="addRow()" class="text-xs font-bold text-blue-600">＋ 추가</button></div>
    <div id="rows" class="space-y-2"></div>
    <button onclick="saveRecord()" class="w-full mt-5 bg-blue-600 text-white font-bold py-4 rounded-2xl">저장하기</button>
  </div>
</div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
const defaults=['국민은행','신한은행','현금'];
const $=id=>document.getElementById(id);
function records(){return JSON.parse(localStorage.getItem('myAssets')||'[]').sort((a,b)=>new Date(b.date)-new Date(a.date));}
function locations(){return JSON.parse(localStorage.getItem('assetCategories')||JSON.stringify(defaults));}
function saveLocations(a){localStorage.setItem('assetCategories',JSON.stringify(a));}
function openRecord(){ $('modal').classList.remove('hidden'); $('date').value=new Date().toISOString().slice(0,10); $('salary').value=localStorage.getItem('salary')||''; buildRows(); }
function closeRecord(){ $('modal').classList.add('hidden'); }
function buildRows(prefill){const r=$('rows');r.innerHTML=''; const ls=prefill||locations(); ls.forEach((n,i)=>addRow(n,prefill?Number(prefill[n]||0):null));}
function addRow(name='',value=null){const d=document.createElement('div');d.className='flex gap-2 asset-row';d.innerHTML=`<input class="name flex-1 min-w-0 border rounded-xl p-3 text-sm" value="${escapeHtml(name)}" placeholder="예: 네이버페이"><input class="bal w-32 border rounded-xl p-3 text-sm" type="number" value="${value??''}" placeholder="잔액"><button onclick="this.parentElement.remove()" class="text-gray-400 px-1">×</button>`;$('rows').appendChild(d);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveRecord(){const date=$('date').value;if(!date)return;const assets={};document.querySelectorAll('.asset-row').forEach(r=>{const n=r.querySelector('.name').value.trim();if(n)assets[n]=Number(r.querySelector('.bal').value)||0;});if(!Object.keys(assets).length)return alert('돈이 들어있는 곳을 하나 이상 적어주세요.');const salary=Number($('salary').value)||0;if(salary)localStorage.setItem('salary',salary);saveLocations(Object.keys(assets));const rec={date,salary,assets,totalAsset:Object.values(assets).reduce((a,b)=>a+b,0)};let d=records().filter(x=>x.date!==date);d.push(rec);localStorage.setItem('myAssets',JSON.stringify(d));closeRecord();render();}
function render(){const d=records();renderMain(d);renderDetails(d);setGuide(d);}
function renderMain(d){if(!d.length){$('cycleBalance').innerText='—';$('cycleSub').innerText='처음이라면 지금 가진 돈을 한번 적어볼까요?';$('totalAsset').innerText='—';$('periodSummary').innerText='';return;}const c=d[0],prev=d[1];$('totalAsset').innerText=c.totalAsset.toLocaleString()+'원';if(prev){const diff=c.totalAsset-prev.totalAsset;const days=Math.max(1,Math.round((new Date(c.date)-new Date(prev.date))/86400000));const salary=c.salary||Number(localStorage.getItem('salary'))||0;const inferred=Math.max(0,salary-diff);$('cycleBalance').innerText=salary?inferred.toLocaleString()+'원':'—';$('cycleSub').innerText=salary?`월급 ${salary.toLocaleString()}원 · 추정해서 쓴 돈 ${inferred.toLocaleString()}원`:`최근 ${days}일 동안 자산 ${diff>=0?'+':''}${diff.toLocaleString()}원`;$('periodSummary').innerText=`최근 기록: ${days}일 전 · 자산 ${diff>=0?'+':''}${diff.toLocaleString()}원`;}else{$('cycleBalance').innerText='—';$('cycleSub').innerText='좋아요. 이제 됐어요. 나중에 다시 오면 그때 같이 볼게요.';$('periodSummary').innerText='첫 기록 · '+c.date;}}
function annual(d){if(d.length<2)return null;const latest=d[0],target=new Date(latest.date);target.setFullYear(target.getFullYear()-1);let base=d[d.length-1];for(const r of d){if(new Date(r.date)<=target){base=r;break;}}const days=(new Date(latest.date)-new Date(base.date))/86400000;if(days<300)return null;return {latest,base,days};}
function renderDetails(d){$('assetList').innerHTML=d.length?Object.entries(d[0].assets).map(([k,v])=>`<div class="flex justify-between py-2 border-b last:border-0"><span>${escapeHtml(k)}</span><b>${v.toLocaleString()}원</b></div>`).join(''):'아직 기록이 없어요.';let h=d.map((r,i)=>{const p=d[i+1];const diff=p?r.totalAsset-p.totalAsset:null;return `<div class="flex justify-between py-3 border-b last:border-0"><div><b>${r.date}</b><div class="text-xs text-gray-400">${p?(diff>=0?'+':'')+diff.toLocaleString()+'원 변화':'첫 기록'}</div></div><b>${r.totalAsset.toLocaleString()}원</b></div>`}).join('');const a=annual(d);if(a){const pct=(a.latest.totalAsset/a.base.totalAsset-1)*100;$('history').innerHTML=`<div class="rounded-xl bg-blue-50 p-4 mb-2"><b>지난 1년</b><div class="text-2xl font-black mt-1">${a.latest.totalAsset-a.base.totalAsset>=0?'+':''}${(a.latest.totalAsset-a.base.totalAsset).toLocaleString()}원</div><div class="text-sm text-gray-600">자산 변화율 ${pct>=0?'+':''}${pct.toFixed(1)}% · ${a.base.date} → ${a.latest.date}</div><div class="text-xs text-gray-500 mt-2">※ 월급으로 새로 모은 돈과 투자·이자 등 수익은 구분하지 않은 단순 자산 변화율이에요.</div></div>`+h;}else $('history').innerHTML=h||'아직 기록이 없어요.';}
let dismissedGuideKey='';
function showGuide(key,text){const b=$('guideBubble'),t=$('guideText');if(dismissedGuideKey===key)return;b.classList.remove('hidden');t.innerText=text;}
function dismissGuide(e){e.stopPropagation();dismissedGuideKey=$('guideText').innerText;$('guideBubble').classList.add('hidden');}
function setGuide(d){const b=$('guideBubble');b.classList.add('hidden');if(!d.length){showGuide('first','처음이라면 지금 가진 돈을 한번 적어볼까요?');return;}const lastDate=d[0].date;const today=new Date().toISOString().slice(0,10);if(lastDate===today)return;const days=(Date.now()-new Date(lastDate))/86400000;if(days>=365)showGuide('365','오랜만이에요. 지금 자산만 한번 적어주시면 지난 1년을 같이 볼게요.');else if(days>=90)showGuide('90','오랜만이에요. 지금 상태만 살짝 볼까요?');else if(days>=30)showGuide('30','한동안 편하게 지내셨죠. 지금 자산만 한번 볼까요?');}
function toggleDetails(){const x=$('details');x.classList.toggle('hidden');$('detailArrow').innerText=x.classList.contains('hidden')?'⌄':'⌃';}
function exportData(){const blob=new Blob([JSON.stringify({myAssets:records(),assetCategories:locations(),salary:localStorage.getItem('salary')||''},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='자산노트_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(){$('fileInput').click();}function handleImport(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(x.myAssets)localStorage.setItem('myAssets',JSON.stringify(x.myAssets));if(x.assetCategories)localStorage.setItem('assetCategories',JSON.stringify(x.assetCategories));if(x.salary)localStorage.setItem('salary',x.salary);render();alert('가져오기가 완료됐어요.');}catch(_){alert('백업 파일을 읽을 수 없어요.');}};rd.readAsText(f);}
function resetData(){if(confirm('저장된 자산 기록을 모두 지울까요?')){localStorage.removeItem('myAssets');localStorage.removeItem('salary');render();}}
window.onload=()=>{if(!localStorage.getItem('assetCategories'))saveLocations(defaults);render();};
</script>
</body></html>
