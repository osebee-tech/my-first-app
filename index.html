<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<title>자산노트</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .asset-row{touch-action:none}
  .drag-handle{cursor:grab;user-select:none}
  .bank-card{background:#eff6ff;border-color:#bfdbfe}
  .wallet-card{background:#fff7ed;border-color:#fed7aa}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{margin:0}
</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans max-w-md mx-auto min-h-screen p-4 pb-10">
<header class="mb-5">
  <h1 class="text-sm font-bold text-gray-400">자산노트</h1>
</header>

<main class="space-y-3">
  <section id="actionArea" class="space-y-3">
    <div id="guideBubble" class="hidden relative bg-gray-900 text-white text-sm rounded-2xl px-4 py-3 pr-10 shadow-lg leading-5">
      <span id="guideText"></span>
      <button id="guideClose" onclick="dismissGuide(event)" aria-label="안내 닫기" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-white/70 text-xl leading-none">×</button>
      <span class="absolute left-10 -bottom-2 w-4 h-4 bg-gray-900 rotate-45"></span>
    </div>
    <button id="recordButton" onclick="openRecord()" class="self-start bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl shadow-sm transition text-sm">＋ 자산 기록</button>
  </section>

  <section class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
    <div class="text-sm font-bold text-gray-400">이번 급여에 남은 돈</div>
    <div id="cycleBalance" class="text-4xl font-black text-gray-900 mt-2">—</div>
    <div id="cycleSub" class="text-sm text-gray-500 mt-2">아직 기록이 없어요.</div>
  </section>

  <section class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
    <div class="text-sm font-bold text-gray-400">내가 모아놓은 돈</div>
    <div id="totalAsset" class="text-3xl font-black text-gray-900 mt-2">—</div>
    <div id="periodSummary" class="text-sm text-gray-500 mt-2"></div>
  </section>

  <button onclick="toggleDetails()" class="w-full py-3 text-sm font-bold text-gray-500">상세 보기 <span id="detailArrow">⌄</span></button>

  <section id="details" class="hidden space-y-4">
    <div class="bg-white rounded-2xl p-5 border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold">내 돈이 들어있는 곳</h2>
        <span class="text-xs text-gray-400">길게 눌러 순서 변경</span>
      </div>
      <div id="assetList" class="space-y-2"></div>
    </div>

    <div class="bg-white rounded-2xl p-5 border border-gray-100">
      <h2 class="font-bold mb-3">지난 기록</h2>
      <div id="history" class="space-y-2"></div>
    </div>

    <div class="bg-white rounded-2xl p-5 border border-gray-100">
      <h2 class="font-bold mb-3">데이터 백업</h2>
      <p class="text-xs text-gray-400 mb-3">앱 데이터 그대로 복원하려면 자산노트 백업을 사용하세요. 엑셀에서 보려면 CSV를 사용하세요.</p>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="exportData('json')" class="border rounded-xl py-3 text-sm font-bold">📦 앱 백업</button>
        <button onclick="exportData('csv')" class="border rounded-xl py-3 text-sm font-bold">📊 엑셀용</button>
      </div>
      <button onclick="importData()" class="w-full mt-2 bg-gray-900 text-white rounded-xl py-3 text-sm font-bold">📥 앱 백업 가져오기</button>
      <input id="fileInput" type="file" accept=".json,application/json" class="hidden" onchange="handleImport(event)">
      <div class="mt-3 text-xs text-gray-400 leading-5">
        저장 위치는 기기/브라우저가 결정합니다. 다운로드 폴더에서 찾기 쉽도록 파일 이름을 <b>자산노트_백업_날짜</b>로 저장합니다.
      </div>
      <button onclick="resetData()" class="w-full mt-3 py-2 text-xs text-gray-400">데이터 초기화</button>
    </div>
  </section>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50">
  <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-lg font-black">자산 기록</h2>
      <button onclick="closeRecord()" class="text-2xl text-gray-400">×</button>
    </div>

    <label class="text-xs font-bold text-gray-500">기록 날짜</label>
    <input id="date" type="date" class="w-full border rounded-xl p-3 mt-1 mb-4">

    <label class="text-xs font-bold text-gray-500">이번 급여 금액</label>
    <input id="salary" inputmode="numeric" autocomplete="off" placeholder="예: 3,000,000" class="w-full border rounded-xl p-3 mt-1 mb-1">
    <div class="text-xs text-gray-400 mb-4">또는 이번 생활비를 적어도 돼요.</div>

    <div class="flex justify-between items-center mb-2">
      <div>
        <label class="text-xs font-bold text-gray-500">돈이 들어있는 곳</label>
        <div class="text-xs text-gray-400 mt-1">생각나는 것부터 대략 적어도 괜찮아요.</div>
      </div>
    </div>

    <div id="rows" class="space-y-2"></div>

    <button onclick="addRow()" class="w-full mt-3 border border-dashed border-gray-300 rounded-xl py-3 text-sm font-bold text-blue-600">＋ 자산 추가</button>
    <p class="text-xs text-gray-400 mt-2">나중에 언제든 수정하거나 추가할 수 있어요.</p>

    <button onclick="saveRecord()" class="w-full mt-5 bg-blue-600 text-white font-bold py-4 rounded-2xl">저장하기</button>
  </div>
</div>

<script>
const STORAGE_KEY='myAssets';
const CATEGORY_KEY='assetCategories';
const SALARY_KEY='salary';
const ORDER_KEY='assetOrder';
const defaults=['국민은행','신한은행','현금'];
const examples=['쿠팡페이','지역화폐','스타벅스 잔액','교통카드 잔액','네이버페이'];

const $=id=>document.getElementById(id);

function records(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').sort((a,b)=>new Date(b.date)-new Date(a.date));}
  catch(_){return [];}
}
function locations(){
  try{
    const a=JSON.parse(localStorage.getItem(CATEGORY_KEY)||'null');
    return Array.isArray(a)&&a.length?a:defaults.slice();
  }catch(_){return defaults.slice();}
}
function saveLocations(a){localStorage.setItem(CATEGORY_KEY,JSON.stringify(a));}
function getOrder(){
  try{return JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');}catch(_){return [];}
}
function saveOrder(a){localStorage.setItem(ORDER_KEY,JSON.stringify(a));}
function isBank(name){
  return /(은행|bank|국민|신한|우리|하나|농협|기업|카카오뱅크|토스뱅크|케이뱅크|SC제일|씨티|새마을금고|신협|수협|우체국|부산|대구|경남|광주|전북|제주)/i.test(name);
}
function money(n){return Number(n||0).toLocaleString('ko-KR');}
function parseMoney(v){return Number(String(v||'').replace(/,/g,''))||0;}
function formatMoneyInput(el){
  const raw=String(el.value).replace(/,/g,'').replace(/[^\d]/g,'');
  el.value=raw?Number(raw).toLocaleString('ko-KR'):'';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function openRecord(){
  $('modal').classList.remove('hidden');
  $('date').value=new Date().toISOString().slice(0,10);
  $('salary').value=localStorage.getItem(SALARY_KEY)?money(localStorage.getItem(SALARY_KEY)):'';
  buildRows();
}
function closeRecord(){$('modal').classList.add('hidden');}

function buildRows(prefill){
  const r=$('rows');r.innerHTML='';
  const names=prefill?Object.keys(prefill):orderedLocations();
  names.forEach(n=>addRow(n,prefill?Number(prefill[n]||0):null));
  if(!names.length)addRow();
  bindMoneyInputs();
}
function orderedLocations(){
  const list=locations();
  const order=getOrder();
  const ordered=[];
  order.forEach(n=>{if(list.includes(n))ordered.push(n);});
  list.forEach(n=>{if(!ordered.includes(n))ordered.push(n);});
  return ordered.sort((a,b)=>Number(isBank(b))-Number(isBank(a)) || ordered.indexOf(a)-ordered.indexOf(b));
}
function addRow(name='',value=null){
  const d=document.createElement('div');
  d.className='flex gap-2 asset-row items-center p-2 rounded-2xl border '+(isBank(name)?'bank-card':'wallet-card');
  d.draggable=true;
  d.innerHTML=`<button type="button" class="drag-handle text-gray-400 px-1 text-lg" title="길게 눌러 이동">☷</button>
    <input class="name flex-1 min-w-0 bg-transparent outline-none p-2 text-sm" value="${escapeHtml(name)}" placeholder="${escapeHtml(nextExample())}">
    <input class="bal w-28 bg-transparent outline-none p-2 text-sm text-right" inputmode="numeric" autocomplete="off" value="${value==null?'':money(value)}" placeholder="잔액">
    <button type="button" class="remove text-gray-400 px-1" aria-label="삭제">×</button>`;
  d.querySelector('.remove').onclick=()=>d.remove();
  d.querySelector('.name').addEventListener('input',()=>updateRowStyle(d));
  setupDrag(d);
  $('rows').appendChild(d);
}
function nextExample(){
  const used=[...document.querySelectorAll('.asset-row .name')].map(x=>x.value);
  return examples.find(x=>!used.includes(x))||'예: 여행통장';
}
function updateRowStyle(row){
  row.classList.toggle('bank-card',isBank(row.querySelector('.name').value.trim()));
  row.classList.toggle('wallet-card',!isBank(row.querySelector('.name').value.trim()));
}
function bindMoneyInputs(){
  document.querySelectorAll('#salary,#rows .bal').forEach(el=>{
    el.addEventListener('input',()=>formatMoneyInput(el));
    el.addEventListener('blur',()=>formatMoneyInput(el));
  });
}
function setupDrag(row){
  row.addEventListener('dragstart',e=>{row.classList.add('opacity-50');e.dataTransfer.setData('text/plain','drag');});
  row.addEventListener('dragend',()=>row.classList.remove('opacity-50'));
  row.addEventListener('dragover',e=>{
    e.preventDefault();
    const dragging=document.querySelector('.asset-row.opacity-50');
    if(dragging&&dragging!==row){
      const rect=row.getBoundingClientRect();
      const before=e.clientY<rect.top+rect.height/2;
      row.parentNode.insertBefore(dragging,before?row:row.nextSibling);
    }
  });
  let timer;
  row.addEventListener('touchstart',()=>{
    timer=setTimeout(()=>row.classList.add('opacity-50'),500);
  },{passive:true});
  row.addEventListener('touchend',()=>{clearTimeout(timer);row.classList.remove('opacity-50');persistCurrentOrder();});
  row.addEventListener('touchmove',()=>clearTimeout(timer),{passive:true});
}
function persistCurrentOrder(){
  const names=[...document.querySelectorAll('#rows .name')].map(x=>x.value.trim()).filter(Boolean);
  if(names.length)saveOrder(names);
}
function saveRecord(){
  const date=$('date').value;if(!date)return;
  const assets={};
  document.querySelectorAll('.asset-row').forEach(r=>{
    const n=r.querySelector('.name').value.trim();
    if(n)assets[n]=parseMoney(r.querySelector('.bal').value);
  });
  if(!Object.keys(assets).length)return alert('생각나는 돈이 하나 이상 있으면 적어주세요.');
  const salary=parseMoney($('salary').value);
  if(salary)localStorage.setItem(SALARY_KEY,String(salary));
  const names=Object.keys(assets);
  saveLocations([...new Set([...locations(),...names])]);
  saveOrder([...new Set([...names,...getOrder()])]);
  const rec={date,salary,assets,totalAsset:Object.values(assets).reduce((a,b)=>a+b,0)};
  let d=records().filter(x=>x.date!==date);d.push(rec);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  closeRecord();render();
}

function render(){const d=records();renderMain(d);renderDetails(d);setGuide(d);}
function renderMain(d){
  if(!d.length){
    $('cycleBalance').innerText='—';
    $('cycleSub').innerText='지금 가진 돈을 대략 한번 적어볼까요? 나중에 고쳐도 괜찮아요.';
    $('totalAsset').innerText='—';$('periodSummary').innerText='';return;
  }
  const c=d[0],prev=d[1];$('totalAsset').innerText=money(c.totalAsset)+'원';
  if(prev){
    const diff=c.totalAsset-prev.totalAsset;
    const salary=c.salary||parseMoney(localStorage.getItem(SALARY_KEY));
    const inferred=Math.max(0,salary-diff);
    $('cycleBalance').innerText=salary?money(inferred)+'원':'—';
    $('cycleSub').innerText=salary?`월급 ${money(salary)}원 · 지금까지 약 ${money(inferred)}원 사용`:'최근 기록과 비교해 자산 변화를 보여드려요.';
    $('periodSummary').innerText=`최근 기록 이후 자산 ${diff>=0?'+':''}${money(diff)}원`;
  }else{
    $('cycleBalance').innerText='—';
    $('cycleSub').innerText='첫 기록이에요. 다음에 한 번 더 적으면 변화가 보여요.';
    $('periodSummary').innerText='첫 기록 · '+c.date;
  }
}
function annual(d){
  if(d.length<2)return null;
  const latest=d[0],target=new Date(latest.date);target.setFullYear(target.getFullYear()-1);
  let base=d[d.length-1];
  for(const r of d){if(new Date(r.date)<=target){base=r;break;}}
  const days=(new Date(latest.date)-new Date(base.date))/86400000;
  if(days<300)return null;return {latest,base,days};
}
function renderDetails(d){
  const latest=d[0];
  $('assetList').innerHTML=latest?orderedAssets(latest.assets).map(([k,v])=>{
    const bank=isBank(k);
    return `<div class="flex justify-between items-center py-3 px-3 rounded-xl ${bank?'bg-blue-50':'bg-orange-50'}"><span>${escapeHtml(k)}</span><b>${money(v)}원</b></div>`;
  }).join(''):'아직 기록이 없어요.';
  let h=d.map((r,i)=>{const p=d[i+1],diff=p?r.totalAsset-p.totalAsset:null;
    return `<div class="flex justify-between py-3 border-b last:border-0"><div><b>${r.date}</b><div class="text-xs text-gray-400">${p?(diff>=0?'+':'')+money(diff)+'원 변화':'첫 기록'}</div></div><b>${money(r.totalAsset)}원</b></div>`;
  }).join('');
  const a=annual(d);
  if(a){
    const pct=(a.latest.totalAsset/a.base.totalAsset-1)*100;
    $('history').innerHTML=`<div class="rounded-xl bg-blue-50 p-4 mb-2"><b>지난 1년</b><div class="text-2xl font-black mt-1">${a.latest.totalAsset-a.base.totalAsset>=0?'+':''}${money(a.latest.totalAsset-a.base.totalAsset)}원</div><div class="text-sm text-gray-600">자산 변화율 ${pct>=0?'+':''}${pct.toFixed(1)}% · ${a.base.date} → ${a.latest.date}</div></div>`+h;
  }else $('history').innerHTML=h||'아직 기록이 없어요.';
}
function orderedAssets(assets){
  const keys=Object.keys(assets),order=getOrder();
  return keys.sort((a,b)=>{
    const bankDiff=Number(isBank(b))-Number(isBank(a));
    if(bankDiff)return bankDiff;
    const ai=order.indexOf(a),bi=order.indexOf(b);
    return (ai<0?999:ai)-(bi<0?999:bi);
  }).map(k=>[k,assets[k]]);
}

let dismissedGuideKey='';
function showGuide(key,text){const b=$('guideBubble'),t=$('guideText');if(dismissedGuideKey===key)return;t.innerText=text;b.classList.remove('hidden');}
function dismissGuide(e){e.stopPropagation();dismissedGuideKey=$('guideText').innerText;$('guideBubble').classList.add('hidden');}
function setGuide(d){
  const b=$('guideBubble');b.classList.add('hidden');
  if(!d.length){showGuide('first','처음이라면 지금 가진 돈을 한번 적어볼까요?');return;}
  const lastDate=d[0].date,today=new Date().toISOString().slice(0,10);if(lastDate===today)return;
  const days=(Date.now()-new Date(lastDate))/86400000;
  if(days>=365)showGuide('365','오랜만이에요. 지금 상태만 살짝 적어주면 돼요.');
  else if(days>=90)showGuide('90','오랜만이에요. 지금 상태만 살짝 볼까요?');
  else if(days>=30)showGuide('30','한동안 편하게 지내셨죠. 지금 자산만 한번 볼까요?');
}
function toggleDetails(){const x=$('details');x.classList.toggle('hidden');$('detailArrow').innerText=x.classList.contains('hidden')?'⌄':'⌃';}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}
function stamp(){return new Date().toISOString().slice(0,10);}
function exportData(type){
  const date=stamp(),d=records();
  if(type==='json'){
    const payload={app:'자산노트',version:2,exportedAt:new Date().toISOString(),myAssets:d,assetCategories:locations(),assetOrder:getOrder(),salary:localStorage.getItem(SALARY_KEY)||''};
    downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),`자산노트_백업_${date}.json`);
    return;
  }
  const rows=[['날짜','이번 급여','돈이 들어있는 곳','금액','총 자산']];
  d.forEach(r=>Object.entries(r.assets||{}).forEach(([name,value])=>rows.push([r.date,r.salary||'',name,value,r.totalAsset])));
  const csv='\\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\\r\\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`자산노트_엑셀용_${date}.csv`);
}
function csvCell(v){const s=String(v??'');return /[",\\r\\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function importData(){$('fileInput').value='';$('fileInput').click();}
function handleImport(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const x=JSON.parse(rd.result);
      if(!x||!Array.isArray(x.myAssets))throw new Error('bad');
      if(!confirm('현재 앱에 있는 기록을 백업 파일의 내용으로 바꿀까요?'))return;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(x.myAssets));
      if(Array.isArray(x.assetCategories))localStorage.setItem(CATEGORY_KEY,JSON.stringify(x.assetCategories));
      if(Array.isArray(x.assetOrder))localStorage.setItem(ORDER_KEY,JSON.stringify(x.assetOrder));
      if(typeof x.salary==='string'||typeof x.salary==='number')localStorage.setItem(SALARY_KEY,String(x.salary));
      render();alert('백업을 불러왔어요.');
    }catch(_){alert('자산노트 백업(.json) 파일이 아니거나 파일이 손상되었어요.');}
  };
  rd.readAsText(f,'utf-8');
}
function resetData(){
  if(confirm('저장된 자산 기록을 모두 지울까요?')){
    localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(SALARY_KEY);
    render();
  }
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('load',()=>{
  if(!localStorage.getItem(CATEGORY_KEY))saveLocations(defaults);
  render();
  bindMoneyInputs();
});
</script>
</body>
</html>
