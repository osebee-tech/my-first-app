<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="자산노트 - 내 돈의 흐름을 기록하고 관찰하는 PWA">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>자산노트</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--blue:#2563eb;--green:#15803d;--red:#dc2626;--amber:#a16207;--shadow:0 8px 24px rgba(17,24,39,.06);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:960px;margin:auto;padding:20px 16px 88px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:800;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--text)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--red)}.yearnav{display:flex;align-items:center;gap:10px}.year{font-size:15px;font-weight:700}.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.summary .card{padding:17px}.label{font-size:12px;color:var(--muted);margin-bottom:8px}.money{font-size:23px;font-weight:800;letter-spacing:-.04em}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}.sectiontitle{font-size:16px;font-weight:800}.hint{font-size:12px;color:var(--muted)}.timeline{overflow:hidden}.month{border-bottom:1px solid var(--line)}.month:last-child{border-bottom:0}.monthrow{display:grid;grid-template-columns:82px 1fr 120px 120px 96px;gap:12px;align-items:center;padding:15px 16px}.monthrow.clickable{cursor:pointer}.monthrow.clickable:hover{background:#fafafa}.mname{font-weight:800}.date{font-size:11px;color:var(--muted);margin-top:3px}.num{text-align:right;font-variant-numeric:tabular-nums}.num .small{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}.status{justify-self:end;font-size:11px;padding:5px 8px;border-radius:999px;background:#f3f4f6;color:#4b5563}.status.done{background:#f0fdf4;color:var(--green)}.status.progress{background:#fffbeb;color:var(--amber)}.status.empty{background:#f3f4f6;color:#9ca3af}.detail{padding:0 16px 16px;background:#fafafa;border-top:1px solid var(--line)}.record{padding:13px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.recordtop{display:flex;justify-content:space-between;align-items:center}.assetgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.assetpill{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;font-size:12px}.memo{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap}.fab{position:fixed;right:20px;bottom:20px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:14px 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.18)}.emptybox{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}.modalback{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modalback.open{display:flex}.modal{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:20px}.modal h2{margin:0 0 16px;font-size:20px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.assetinput{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:8px}.assetinput input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.tabs{display:flex;gap:7px;margin-bottom:16px}.tab{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.tab.active{background:#111827;color:#fff;border-color:#111827}.notice{font-size:12px;color:var(--muted);background:#f9fafb;border:1px solid var(--line);padding:10px;border-radius:10px;margin-bottom:12px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:30}.toast.show{display:block}@media(max-width:720px){.app{padding:16px 12px 88px}.summary{grid-template-columns:1fr}.monthrow{grid-template-columns:72px 1fr;gap:8px}.monthrow>.num{display:block;text-align:left}.monthrow>.status{justify-self:start}.assetgrid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.actions .secondary{display:none}.top{align-items:flex-start}}
</style></head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="addBtn">＋ 기록</button>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
